name: Branch Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes, UTC. GitHub may delay this
                            # a few minutes during busy periods - that's normal.
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email only (skip branch checks)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write            # needed so the workflow can commit state.json back

concurrency:
  group: branch-monitor
  cancel-in-progress: false  # never cancel a run mid-way, just queue the next one

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run monitor
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/monitor.py --test-email
          else
            python scripts/monitor.py
          fi

      - name: Commit updated state.json
        if: ${{ inputs.test_email != true }}
        run: |
          git config user.name "branch-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # Keep this run's freshly-checked results safe on the side, since
          # the newest check is always the one we want to keep - a
          # concurrent run's older commit landing first should never cause
          # this one to be lost or to fail the job.
          cp state.json /tmp/state.json.new

          for attempt in 1 2 3 4 5; do
            cp /tmp/state.json.new state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "No change to commit."
              exit 0
            fi
            git commit -m "Update monitor state [skip ci]"

            if git push; then
              echo "Pushed successfully."
              exit 0
            fi

            echo "Push rejected (attempt $attempt/5) - another run committed first. Syncing and retrying..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

          echo "Failed to push after 5 attempts."
          exit 1
