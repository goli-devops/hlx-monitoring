<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Front Desk Status</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1320;
    --panel: #10192A;
    --line: #1E2A3E;
    --text: #EAEFF5;
    --muted: #7C8AA0;
    --up: #35C97C;
    --down: #FF5C5C;
    --down-dim: #241417;
    --amber: #E8A33D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

  .live {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--up);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(53, 201, 124, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(53, 201, 124, 0); }
    100% { box-shadow: 0 0 0 0 rgba(53, 201, 124, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

  .summary {
    display: flex; gap: 28px; margin-bottom: 40px; flex-wrap: wrap;
  }
  .stat { min-width: 110px; }
  .stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600; line-height: 1; }
  .stat .label { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stat.up .num { color: var(--up); }
  .stat.down .num { color: var(--down); }

  .down-summary {
    background: var(--down-dim, #2A1216);
    border: 1px solid var(--down);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 32px;
  }

  .down-summary-title {
    color: var(--down);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .down-summary-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .down-chip {
    background: rgba(255, 92, 92, 0.12);
    color: var(--text);
    border: 1px solid rgba(255, 92, 92, 0.35);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .down-chip .mono { color: var(--down); }

  .group { margin-bottom: 36px; }

  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .group-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .group-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .group-count.has-down { color: var(--down); }

  .row {
    display: grid;
    grid-template-columns: 4px 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--line);
  }

  .bar { align-self: stretch; border-radius: 2px; background: var(--up); }
  .row.down .bar { background: var(--down); }
  .row.unknown .bar { background: var(--amber); }

  .name { font-weight: 600; font-size: 14px; }
  .url { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; word-break: break-all; }

  .status { text-align: right; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .row.up .status { color: var(--up); }
  .row.down .status { color: var(--down); }
  .row.unknown .status { color: var(--amber); }

  .meta { text-align: right; color: var(--muted); font-size: 11.5px; white-space: nowrap; min-width: 120px; }

  footer {
    margin-top: 32px; color: var(--muted); font-size: 12.5px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }

  button {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .empty { color: var(--muted); padding: 40px 4px; font-size: 14px; }

  @media (max-width: 600px) {
    .row { grid-template-columns: 4px 1fr; }
    .status, .meta { grid-column: 2; text-align: left; margin-top: 2px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Front Desk Status</h1>
      <p class="subtitle">Branch login-page availability by property, refreshed automatically</p>
    </div>
    <div class="live"><span class="dot"></span><span id="lastUpdated">loading…</span></div>
  </header>

  <div class="summary">
    <div class="stat up"><div class="num" id="upCount">–</div><div class="label">online</div></div>
    <div class="stat down"><div class="num" id="downCount">–</div><div class="label">down</div></div>
    <div class="stat"><div class="num mono" id="totalCount">–</div><div class="label">branches monitored</div></div>
  </div>

  <div id="groups">
    <div class="empty">Loading branch status…</div>
  </div>

  <footer>
    <span>Checked every 5 minutes by a GitHub Actions workflow.</span>
    <button id="refreshBtn">Refresh now</button>
  </footer>
</div>

<script>
  // ---- Configure this ----
  const STATE_URL = "https://raw.githubusercontent.com/goli-devops/hlx-monitoring/main/state.json";
  const REFRESH_MS = 45000;

  const groupsEl = document.getElementById('groups');
  const upEl = document.getElementById('upCount');
  const downEl = document.getElementById('downCount');
  const totalEl = document.getElementById('totalCount');
  const lastUpdatedEl = document.getElementById('lastUpdated');

  function timeAgo(iso) {
    if (!iso) return 'never';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function duration(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ' + (mins % 60) + 'm';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function load() {
    try {
      const res = await fetch(STATE_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
    } catch (err) {
      groupsEl.innerHTML = '<div class="empty">Couldn\'t load status right now (' + err.message + '). Retrying shortly…</div>';
    }
  }

  function render(data) {
    const sites = Object.values(data.sites || {});

    if (sites.length === 0) {
      groupsEl.innerHTML = '<div class="empty">No checks recorded yet. The first monitor run will populate this shortly.</div>';
      upEl.textContent = '0'; downEl.textContent = '0'; totalEl.textContent = '0';
      lastUpdatedEl.textContent = 'no data yet';
      return;
    }

    const upSites = sites.filter(s => s.status === 'up');
    const downSites = sites.filter(s => s.status === 'down');
    upEl.textContent = upSites.length;
    downEl.textContent = downSites.length;
    totalEl.textContent = sites.length;

    // Group by property, in the order groups first appear (roughly
    // matches config.json order since state.json preserves insertion).
    const byGroup = new Map();
    for (const s of sites) {
      const g = s.group || 'Ungrouped';
      if (!byGroup.has(g)) byGroup.set(g, []);
      byGroup.get(g).push(s);
    }

    let html = '';

    if (downSites.length > 0) {
      const sortedDown = [...downSites].sort((a, b) =>
        (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
      html += '<div class="down-summary">';
      html += '<div class="down-summary-title">' +
              '\u26A0 ' + downSites.length + ' branch' + (downSites.length === 1 ? '' : 'es') + ' currently down</div>';
      html += '<div class="down-summary-list">' + sortedDown.map(s =>
        '<span class="down-chip">' + escapeHtml(s.name || '') + ' <span class="mono">(' + duration(s.down_since) + ')</span></span>'
      ).join('') + '</div>';
      html += '</div>';
    }

    for (const [groupName, branches] of byGroup.entries()) {
      branches.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
      const downInGroup = branches.filter(b => b.status === 'down').length;
      const countLabel = downInGroup > 0
        ? (branches.length - downInGroup) + ' / ' + branches.length + ' online'
        : branches.length + ' / ' + branches.length + ' online';

      html += '<div class="group">';
      html += '<div class="group-header"><span class="group-name">' + escapeHtml(groupName) + '</span>' +
              '<span class="group-count mono' + (downInGroup > 0 ? ' has-down' : '') + '">' + countLabel + '</span></div>';

      html += branches.map(s => {
        const cls = s.status === 'up' ? 'up' : (s.status === 'down' ? 'down' : 'unknown');
        const label = s.status === 'up' ? 'Online' : (s.status === 'down' ? 'Down' : 'Unknown');
        const metaLine = s.status === 'down'
          ? 'down ' + duration(s.down_since)
          : 'checked ' + timeAgo(s.last_checked);
        return (
          '<div class="row ' + cls + '">' +
            '<div class="bar"></div>' +
            '<div><div class="name">' + escapeHtml(s.name || '') + '</div>' +
              '<span class="url mono">' + escapeHtml(s.url || '') + '</span></div>' +
            '<div class="status">' + label + '</div>' +
            '<div class="meta mono">' + metaLine + '</div>' +
          '</div>'
        );
      }).join('');

      html += '</div>';
    }

    groupsEl.innerHTML = html;
    lastUpdatedEl.textContent = data.generated_at ? ('updated ' + timeAgo(data.generated_at)) : 'no data yet';
  }

  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
